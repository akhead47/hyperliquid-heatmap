name: Collect and publish liquidation map
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: hyperliquid-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect real BTC positions
        env:
          WALLET_LIMIT: '5000'
          REQUEST_INTERVAL: '0.35'
        run: python collector.py
      - name: Preserve history in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update liquidation snapshots'
            git push
          fi
      - name: Assemble public files
        run: |
          mkdir -p public/data
          cp index.html public/index.html
          cp data/history.json data/latest.json public/data/
          if [ -f data/candles.json ]; then cp data/candles.json public/data/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
